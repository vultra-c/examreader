<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考点传输 — Web 版</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<!-- 头部 -->
<header class="header">
  <div class="header-content">
    <div class="header-left">
      <span class="header-icon">📚</span>
      <div>
        <h1 class="header-title">考点传输</h1>
        <p class="header-subtitle">通过浏览器连接小米手环，传输考点文件</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-indicator">
        <span id="statusDot" class="status-dot status-dot-disconnected"></span>
        <span id="connectionStatus" class="status-text">未连接</span>
      </div>
      <button id="btnConnect" class="btn btn-primary">连接设备</button>
    </div>
  </div>
</header>

<!-- 主内容 -->
<main class="main">

  <!-- 设备管理 -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">设备管理</h2>
      <button id="btnAddDevice" class="btn btn-outline btn-sm">+ 添加设备</button>
    </div>
    <div id="deviceList" class="device-list"></div>
  </section>

  <!-- 文件树 -->
  <section id="treeCard" class="card card-disabled">
    <div class="card-header">
      <h2 class="card-title">手环文件树</h2>
      <div class="card-actions">
        <button id="btnRefreshTree" class="btn btn-outline btn-sm">刷新</button>
        <button id="btnNewFolder" class="btn btn-outline btn-sm">新建文件夹</button>
        <button id="btnRename" class="btn btn-outline btn-sm" disabled>重命名</button>
        <button id="btnDeleteNode" class="btn btn-danger-outline btn-sm" disabled>删除选中</button>
        <button id="btnSetTarget" class="btn btn-primary-outline btn-sm" disabled>设为传输目标</button>
      </div>
    </div>
    <div class="tree-status">
      <span id="treeStatus" class="tree-status-text">未同步</span>
    </div>
    <div id="treeContainer" class="tree-container"></div>
  </section>

  <!-- 文件传输 -->
  <section id="transferCard" class="card card-disabled">
    <div class="card-header">
      <h2 class="card-title">文件传输</h2>
    </div>

    <!-- 文件选择 -->
    <div class="transfer-section">
      <label class="transfer-label">选择文件</label>
      <div class="file-select-area">
        <button id="btnSelectFile" class="btn btn-outline">选择 TXT 文件</button>
        <input type="file" id="fileInput" accept=".txt" style="display:none">
        <div class="file-info">
          <span id="selectedFileName" class="file-name">未选择文件</span>
          <span id="selectedFileDetail" class="file-detail"></span>
        </div>
      </div>
    </div>

    <!-- 目标文件夹 -->
    <div class="transfer-section">
      <label class="transfer-label">目标位置</label>
      <div id="targetFolderDisplay" class="target-folder-display">上传到: 主页</div>
    </div>

    <!-- 传输按钮 -->
    <div class="transfer-section">
      <button id="btnSend" class="btn btn-primary btn-lg" disabled>发送到手环</button>
    </div>

    <!-- 进度条 -->
    <div id="progressBarContainer" class="progress-container" style="display:none">
      <progress id="progressBar" class="progress-bar" max="100" value="0"></progress>
      <span id="progressText" class="progress-text">准备中...</span>
    </div>
  </section>

  <!-- 传输记录 -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">传输记录</h2>
    </div>
    <div id="historyList" class="history-list"></div>
  </section>

  <!-- 操作日志 -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">操作日志</h2>
      <div class="card-actions">
        <button id="btnToggleLog" class="btn btn-outline btn-sm">收起日志</button>
        <button id="btnClearLog" class="btn btn-outline btn-sm">清空</button>
      </div>
    </div>
    <div id="logPanel" class="log-panel">
      <div id="logContainer" class="log-container"></div>
    </div>
  </section>

  <!-- 调试面板 -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">调试信息</h2>
      <div class="card-actions">
        <button id="btnToggleDebug" class="btn btn-outline btn-sm">展开调试</button>
        <button id="btnCopyDebug" class="btn btn-outline btn-sm">复制调试信息</button>
      </div>
    </div>
    <div id="debugPanel" class="log-panel" style="display:none">
      <div id="debugContainer" class="log-container" style="max-height: 300px; font-family: monospace; font-size: 12px;"></div>
    </div>
  </section>

</main>

<!-- 设备添加弹窗 -->
<div id="deviceFormOverlay" class="overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">添加设备</h3>
      <button id="btnCancelDevice" class="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div id="scanStatus" class="scan-status">点击下方按钮扫描蓝牙设备</div>
      <div class="form-group">
        <label class="form-label">设备名称 *</label>
        <input id="formName" type="text" class="form-input" placeholder="如: 小米手环9">
      </div>
      <div class="form-group">
        <label class="form-label">设备地址 (MAC)</label>
        <input id="formAddr" type="text" class="form-input" placeholder="扫描后自动填充，或手动输入">
      </div>
      <div class="form-group">
        <label class="form-label">认证密钥 (Auth Key) *</label>
        <input id="formAuthkey" type="text" class="form-input" placeholder="32位十六进制密钥，如: b0f9c10d025c6b7333bf21f3a701e5fc">
        <p class="form-hint">从小米运动健康 App 数据库中提取，需 root 权限</p>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">SAR 版本</label>
          <select id="formSarVersion" class="form-select">
            <option value="2">SAR v2 (新版设备)</option>
            <option value="1">SAR v1 (旧版设备)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">连接方式</label>
          <select id="formConnectType" class="form-select">
            <option value="SPP">SPP (经典蓝牙)</option>
            <option value="BLE">BLE (低功耗蓝牙)</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btnScanDevice" class="btn btn-outline">重新扫描</button>
        <button id="btnSaveDevice" class="btn btn-primary">保存设备</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast 容器 -->
<div id="toastContainer" class="toast-container"></div>

<!-- 页脚 -->
<footer class="footer">
  <p>基于 BandBurg + AstroBox-NG WASM 模块 · Web Serial API · 仅支持 Chrome/Edge</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
